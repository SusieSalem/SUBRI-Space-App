<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSION ARCHITECT — NASA SPACE APPS 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030407;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-faint: #334155;
      --nasa-red: #fc3d21;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .viewport {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 20px;
    }

    .org-mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .nasa-rule {
      display: inline-block;
      width: 18px;
      height: 2px;
      background: var(--nasa-red);
    }

    main {
      max-width: 680px;
      margin: auto 0;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .lead {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 520px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      border-top: 1px solid var(--border-subtle);
      padding-top: 20px;
      text-transform: uppercase;
    }

    footer span strong {
      color: var(--text-muted);
      font-weight: 400;
    }

    @media (max-width: 640px) {
      .viewport {
        padding: 24px;
      }
      header, footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="viewport">
    <header>
      <div class="org-mark">
        <span class="nasa-rule"></span>
        <span>NASA Space Apps Challenge 2026</span>
      </div>
    </header>

    <main>
      <div class="eyebrow">Challenge // Space Mission Design</div>
      <h1>MISSION<br>ARCHITECT</h1>
      <p class="lead">
        A 3D space mission design simulation by team <strong>!subri</strong>.
      </p>
    </main>

    <footer>
      <span>Team <strong>!subri</strong></span>
      <span>Node <strong>subri-space.web.app</strong></span>
    </footer>
  </div>

  <script>
    (function initStars() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const count = 180;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function build() {
        stars = [];
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.2 + 0.3,
            alpha: Math.random() * 0.8 + 0.2,
            speed: Math.random() * 0.008 + 0.002,
            delta: Math.random() * Math.PI
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.delta += s.speed;
          const a = s.alpha * (0.6 + 0.4 * Math.sin(s.delta));
          ctx.fillStyle = `rgba(240, 246, 255, ${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => {
        resize();
        build();
      });

      resize();
      build();
      draw();
    })();
  </script>
</body>
</html>
